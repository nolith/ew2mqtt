[project]
name = "ew2mqtt"
version = "0.1.0"
description = "BLE to MQTT bridge for Free2Move EasyWallbox chargers"
authors = [
  { name = "Mihai Stana", email = "2051364+mihaistana@users.noreply.github.com" },
  { name = "Alessio Caiazza", email = "code.git@caiazza.info" }
]
requires-python = ">=3.10"

dependencies = [
    "aiomqtt",
    "bleak",
]

[project.scripts]
ew2mqtt = "easywallbox:cli_main"
ew2mqtt-terminal = "terminal:main"
ble_scan = "scan:main"

[tool.setuptools]
py-modules = [
    "easywallbox",
    "scan",
    "settings",
    "blemap",
    "commands",
    "mqttmap",
    "readinfo",
    "repeating_timer",
    "sd_notify",
    "terminal"
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
